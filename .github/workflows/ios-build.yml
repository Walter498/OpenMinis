name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [assistant-response-edit]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test standalone storage
        run: python3 scripts/test_standalone_storage.py

      - name: Prepare build inputs
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          mkdir -p deps/frameworks build/frameworks deps/resources

      - name: Build iSH and media dependencies
        run: |
          brew install ninja llvm lld libarchive pkg-config meson go
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          export LDFLAGS="-L$(brew --prefix llvm)/lib -L$(brew --prefix lld)/lib"
          clang -target aarch64-linux-gnu -fuse-ld=lld -Wl,--version
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Archive Minis
        run: |
          rm -rf build/Minis.xcarchive
          xcodebuild archive \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -archivePath "$PWD/build/Minis.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=11402 \
            | tee /tmp/xcodebuild-archive.log

          test "${PIPESTATUS[0]}" -eq 0 || { cat /tmp/xcodebuild-archive.log; exit 1; }
          test -d build/Minis.xcarchive/Products/Applications/Minis.app

      - name: Package unsigned IPA
        run: |
          rm -rf build/Payload build/OpenMinis-assistant-response-edit.ipa
          mkdir -p build/Payload
          cp -R build/Minis.xcarchive/Products/Applications/Minis.app build/Payload/Minis.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload build/OpenMinis-assistant-response-edit.ipa
          ls -lh build/OpenMinis-assistant-response-edit.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-assistant-response-edit-ipa
          path: build/OpenMinis-assistant-response-edit.ipa
          if-no-files-found: error
          retention-days: 7

